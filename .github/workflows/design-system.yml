name: Design System 2.0

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'src/renderer/**'
      - 'docs/design-guidelines.md'
      - 'docs/design-system/**'
      - 'scripts/design-v2-check.cjs'
      - 'assets/**'
      - 'src/renderer/assets/**'
      - '.github/workflows/design-system.yml'
  workflow_dispatch:

jobs:
  design-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir docs/design-system/v2 install --frozen-lockfile
      - run: node scripts/design-v2-check.cjs
      - run: pnpm --dir docs/design-system/v2 build
