appId: com.dorck.mydashboard
productName: MyDashboard
copyright: Copyright © 2024-2026 Dorck

directories:
  output: dist
  buildResources: build

files:
  - out/**/*

asar: true

extraResources:
  - from: resources/voice-runtime
    to: voice-runtime
    filter:
      - '**/*.py'
      - '*.txt'

extraMetadata:
  main: out/main/index.js

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon-1024.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MyDashboard

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon-1024.png
  category: Office
  synopsis: Local-first personal productivity workspace
  description: MyDashboard is an Electron desktop app that brings projects, writing, media assets, RSS reading, social insights, and AI tooling into one local-first workspace.
  maintainer: Moosphan <Moosphan@users.noreply.github.com>
